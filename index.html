<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandi Agent - All India</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:16px}
input{padding:12px;width:100%;border-radius:8px;margin:6px 0;box-sizing:border-box}
.card{background:white;color:black;padding:14px;border-radius:12px;margin-top:12px}
button{background:#22c55e;border:0;padding:13px;width:100%;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px}
.book{background:#2563eb;color:white;border:0;padding:10px;width:100%;border-radius:8px;margin-top:8px;font-weight:bold}
small{color:#a3a3a3}
</style>
</head>
<body>
<h1>🚆 Vandi Agent</h1>
<small>All India Stations - Type panni select pannu</small><br><br>

<label>From:</label>
<input id="from" list="stations" placeholder="Ex: Coimbatore, Delhi, Mumbai..." value="Coimbatore">

<label>To:</label>
<input id="to" list="stations" placeholder="Ex: Chennai, Bangalore..." value="Chennai">

<datalist id="stations"></datalist>

<label>Date:</label>
<input type="date" id="date" value="2026-12-24">

<button onclick="search()">Search Trains</button>
<div id="result"></div>

<script>
let stations = [
"Chennai Central","Chennai Egmore","Tambaram","Coimbatore Junction","Tirunelveli Junction","Madurai Junction","Trichy Junction","Salem Junction","Erode Junction","Thanjavur Junction","Vellore Katpadi","Kanyakumari","Tuticorin","Dindigul","Villupuram","Karur","Tiruppur","Nagercoil","Karaikudi","Rameswaram",
"New Delhi","Old Delhi","Hazrat Nizamuddin","Mumbai Central","Mumbai CSMT","Dadar","Thane","Pune Junction","Ahmedabad Junction","Surat","Vadodara","Jaipur Junction","Jodhpur","Udaipur","Ajmer",
"Howrah Junction","Sealdah","Kolkata","Patna Junction","Gaya","Lucknow","Kanpur Central","Varanasi Junction","Prayagraj","Bhopal Junction","Indore Junction","Gwalior",
"Bangalore City","Yesvantpur","Mysuru Junction","Hubballi","Mangaluru Central","Kochi Ernakulam","Thiruvananthapuram Central","Kozhikode","Kannur","Palakkad",
"Hyderabad Deccan","Secunderabad Junction","Vijayawada Junction","Visakhapatnam","Guntur","Warangal","Tirupati","Nellore","Rajahmundry",
"Chandigarh","Amritsar Junction","Ludhiana","Jammu Tawi","Dehradun","Haridwar","Rishikesh","Agra Cantt","Mathura Junction","Jhansi Junction","Nagpur Junction","Nashik Road","Aurangabad","Kolhapur","Solapur","Belagavi","Guwahati","Dibrugarh","Bhubaneswar","Cuttack","Puri","Ranchi","Raipur Junction","Bilaspur Junction","Jabalpur","Ujjain","Kota Junction","Bikaner","Rajkot","Bhavnagar","Goa Madgaon","Vasco Da Gama"
];
let dl = document.getElementById("stations");
stations.forEach(s=>{ let o=document.createElement("option"); o.value=s; dl.appendChild(o); });

function bookTrain(details){
navigator.clipboard.writeText(details);
alert("Copied: " + details + "\nIRCTC la paste pannidu!");
window.open('https://www.irctc.co.in/nget/train-search','_blank');
}

function search(){
let from = document.getElementById("from").value.trim();
let to = document.getElementById("to").value.trim();
let date = document.getElementById("date").value;
if(!from || !to){ document.getElementById("result").innerHTML="<div class='card'>From-um To-vum type pannu!</div>"; return; }
if(from.toLowerCase()==to.toLowerCase()){ document.getElementById("result").innerHTML="<div class='card'>From-um To-vum ore station ah iruka koodathu!</div>"; return; }
let html = "<h3>"+from+" → "+to+" | "+date+"</h3>";

if(from.includes("Coimbatore") && to.includes("Chennai")){
html += "<div class='card'><b>12676 Kovai Express</b><br>06:10 AM → 01:45 PM<br><b>₹160 Sleeper | ₹480 AC</b><button class='book' onclick=\"bookTrain('12676 Kovai Express, Coimbatore to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>12640 Cheran Express</b><br>10:00 PM → 05:05 AM<br><b>₹180 Sleeper | ₹520 AC</b><button class='book' onclick=\"bookTrain('12640 Cheran Express, Coimbatore to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>20627 Vande Bharat</b><br>06:15 AM → 01:40 PM<br><b>₹755 Chair Car</b><button class='book' onclick=\"bookTrain('20627 Vande Bharat, Coimbatore to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
}
else if(from.includes("Tirunelveli") && to.includes("Chennai")){
html += "<div class='card'><b>12632 Nellai Express</b><br>07:15 PM → 04:15 AM<br><b>₹210 Sleeper | ₹560 AC</b><button class='book' onclick=\"bookTrain('12632 Nellai Express, Tirunelveli to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>12666 Cape - Tambaram Express</b><br>04:00 PM → 05:10 AM<br><b>₹200 Sleeper</b><button class='book' onclick=\"bookTrain('12666 Cape Express, Tirunelveli to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
}
else if(from.includes("Madurai") && to.includes("Chennai")){
html += "<div class='card'><b>12638 Pandian Express</b><br>09:40 PM → 06:05 AM<br><b>₹185 Sleeper</b><button class='book' onclick=\"bookTrain('Pandian Express, Madurai to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
}
  else if(from.includes("New Delhi") && to.includes("Mumbai")){
html += "<div class='card'><b>12951 Mumbai Rajdhani Express</b><br>04:35 PM → 08:35 AM<br><b>₹1,300 3AC | ₹2,100 2AC</b><button class='book' onclick=\"bookTrain('12951 Rajdhani, Delhi to Mumbai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>12953 August Kranti Rajdhani</b><br>05:00 PM → 09:30 AM<br><b>₹1,250 3AC</b><button class='book' onclick=\"bookTrain('12953 August Kranti, Delhi to Mumbai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>12247 Bandra Terminus Yuva Express</b><br>06:00 PM → 10:00 AM<br><b>₹750 Sleeper</b><button class='book' onclick=\"bookTrain('12247 Yuva Express, Delhi to Mumbai, "+date+"')\">Book on IRCTC →</button></div>";
}
else if(from.includes("Bangalore") && to.includes("Chennai")){
html += "<div class='card'><b>12640 Brindavan Express</b><br>07:50 AM → 01:40 PM<br><b>₹120 2S | ₹450 CC</b><button class='book' onclick=\"bookTrain('Brindavan Express, Bangalore to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
html += "<div class='card'><b>12028 Shatabdi Express</b><br>06:00 AM → 11:00 AM<br><b>₹600 CC</b><button class='book' onclick=\"bookTrain('Shatabdi, Bangalore to Chennai, "+date+"')\">Book on IRCTC →</button></div>";
}
else {
html += "<div class='card'><b>"+from+" → "+to+"</b><br>Unakku etha route ku trains venumo, atha IRCTC la live ah paakalam.<br><br>From: "+from+"<br>To: "+to+"<br>Date: "+date+"<button class='book' onclick=\"bookTrain('"+from+" to "+to+", "+date+"')\">Check Live Trains on IRCTC →</button></div>";
html += "<div class='card'>💡 Tip: IRCTC la login pannitu, mela copy panna details ah paste pannidu, full train list varum.</div>";
}
document.getElementById("result").innerHTML = html;
}
search();
</script>
</body>
</html>
